three_layer_design:
  registered: "2026-09-22（治理变更 PLAN register three-layer fold-switch workflow；用户文档为准）"
  tasks: [T-FS-L1-PAIRED, T-FS-L2-PU-RANK, T-FS-L3-MATCHED]
  umbrella: T-FS-GLOBAL
  residue_layer_task: T-FS-REGION
  evidence_questions: E1 阳性内部可读状态/区域信号；E2 信号在未标注背景富集已知阳性；
    E3 信号在匹配对照中保持区分；E4 未见蛋白/家族复现（归 P5.06 证据矩阵分列裁决）
  disciplines:
    - 背景蛋白 biological_target 恒为空；pu_observed_label=0 仅表示"当前未被确认为阳性"
    - PN-A/B/C 是证据覆盖程度，不是生物学已证明不转换；候选阶段不写 target=0
    - 病例-对照类别比例由设计产生，L3 校准与发生概率解释 disabled
    - matched_set_id 不可跨集合；历史曝光不能通过重新划分恢复未见状态

coverage_check:
  rule: 每个 claim 至少一个证据任务；每个任务至少服务于一个 claim
  unmapped_tasks_review: P1.03–P1.09、P2.01–P2.05 为数据/基础设施任务，通过标签质量与
    隔离有效性间接支撑全部 claim，不单列映射；P6.x 为交付任务。

