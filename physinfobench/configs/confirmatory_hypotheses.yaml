# -----------------------------------------------------------------------------
# 确认假设（有限集：3 条主假设；全部预注册方向/指标/阈值/失败判据）
# -----------------------------------------------------------------------------
hypotheses:
  - id: H-FSL2-RANK
    claim: C-GE1（跨家族泛化）+ BN5
    statement: 冻结线性打分器（L5=hidden 29、C=0.1，dev 拟合）将确认集 strict 阳性
      在全背景排序中置于前列（development：percentile 2.7e-05、recall@1000=1.0）。
    direction: 阳性排名显著前于随机（percentile 越低越强）
    metric: positive_rank_percentile（主）+ recall@1000/@100（辅）
    pass: recall@1000 ≥ 0.5（比例语义；确认集 strict 阳性数由 P5.01 钉版落盘，
      n_strict=0 → 证据不足而非失败）
    strong_pass: recall@1000 = 1.0 且 percentile ≤ 0.001
    fail: recall@1000 < 0.2 或 percentile > 0.05（≈随机水平）
    boundary: 直推排序语义；不构成状态判别或因果主张。

  - id: H-KNOT-PRESENCE
    claim: C-GE1 + T-KNOT-PRESENCE
    statement: 打结存在性在确认集可读（development AUROC 0.929，K-POOLED hidden33/C1）。
    direction: AUROC > 0.5（阳性高于阴性）
    metric: AUROC（确认集 24 阳/126 阴；同一固定读出，无再拟合）
    pass: AUROC ≥ 0.80（development 0.929 的保守折扣）
    strong_pass: AUROC ≥ 0.90
    fail: 点估计 <0.65 且 95%CI 上界 <0.80；点估计 <0.80 但上界 ≥0.80=证据不足（中间带）
    boundary: 条件无关全局属性；不外推打结类型。

  - id: H-DISORDER-RES
    claim: C-GE1 + T-DISORDER-RES
    statement: 残基级无序可读（development per-protein AUPRC 0.904（n=4 描述）、
      池化 0.9996；hidden33 逐残基线性，C=0.01=dev 选中，P5.01 lock 钉版）。
    direction: AUPRC 高于残基正例率基线
    metric: 确认集分母域残基池化 AUPRC（主）+ 逐蛋白 AUPRC（描述，双类蛋白列数披露）
    pass: 池化 AUPRC ≥ 0.90
    strong_pass: 池化 AUPRC ≥ 0.97
    fail: 池化 AUPRC < 0.75
    boundary: 池化口径天花板效应在 dev 已示警——确认阈值按池化口径冻结，逐蛋白口径
      仅描述。

