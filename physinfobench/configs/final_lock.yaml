# -----------------------------------------------------------------------------
# 运行协议（与确认侧同冻结读出/指标/对照；判据同 confirmatory_hypotheses.yaml）
# -----------------------------------------------------------------------------
run_ids:
  knots: HOLD-KNOT-PRESENCE-P505-v1
  disorder: HOLD-DISORDER-RES-P505-v1
  fsl2: 不运行（gate.fsl2_holdout_decision）

run_protocol:
  knots: >-
    读出=hidden33 全残基均值 LogisticRegression(C=1, balanced, liblinear,
    max_iter=1000, seed 2026) 仅 dev 拟合；holdout 108 链评分；AUROC + 蛋白单位
    bootstrap CI（B=2000）+ 置换零分布（×100，seed 2026..2125）+ log1p(链长) 负对照。
  disorder: >-
    读出=hidden33 逐残基（分母域）LogisticRegression(C=0.01, balanced, liblinear,
    max_iter=1000, seed 2026) 仅 dev 拟合；holdout 494 蛋白池化 AUPRC + CI +
    蛋白内置换 ×100 + 基率并列 + 双类蛋白计数披露（判读前置量，degeneracy_note）。
  judgement_note: >-
    判据阈值沿 confirmatory_hypotheses.yaml（knots strong_pass ≥0.90；disorder 机械
    阈值仅报告、判读须过双类/基率前置量——P5.03 已确立退化不作为确认证据的先例）；
    与确认阶段方向不一致时按泛化失败/不确定性报告，不回传调参。

# -----------------------------------------------------------------------------
# 执行矩阵 / 输出 schema / 资源预算 / 失败重跑规则
# -----------------------------------------------------------------------------
execution_matrix:
  jobs: 1（sbatch scripts/sbatch_p505.sh；GPU 纪律 --gres=gpu:1；预期 ≤1h 墙钟；
    -t 04:00:00 为 SLURM 队列上限非预期用时）
  expected_outputs:
    - results/holdout/HOLD-KNOT-PRESENCE-P505-v1/{scores.tsv(108 行数据), metrics.json}
    - results/holdout/HOLD-DISORDER-RES-P505-v1/{residue_scores.tsv.gz(51,134 行数据), metrics.json}
    - results/holdout/holdout_qc.json、first_read_record.json
  failure_rerun_rule: >-
    仅运行性失败（节点/网络/抽取中断）可按原配置续跑（抽取幂等、评估受 first_read
    守卫约束需人工清理后原样重跑并留痕）；结果驱动的模型/阈值修改禁止用同一保留集
    重测——须回 P5.03/P5.04 走差异清单。
  output_schema: >-
    与 results/confirmation/ 同 schema（sample_id,label,score / protein,resid,label,score；
    metrics.json 固定键集 + executed_at 双时间戳）。

