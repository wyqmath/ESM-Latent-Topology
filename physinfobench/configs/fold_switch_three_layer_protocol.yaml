L1_paired_mechanism:
  question: 阳性内部的机制诊断——表征可读性/条件贡献/区域定位（结论限于阳性内部，不受阴性缺失影响）
  population: strict_state_candidate 10 对（same UniProt 10/10、突变 0/10、primary_full_text 证据 10/10；按证据强度分层的候选——两维度分列报告：序列身份=P1.13/20，双态原文=P1.14/20 四层，porter_9/80 保留旧审计依赖标注）
  unit: 配对（pair_id；两端永不分离）
  input: 序列 + 预登记条件元数据（构象状态/条件）
  observed_label: 状态二分类（pair 内对照）；residue 任务=文献区段（主口径=fine∧usable 3 对 6 行案例级，G1 2026-09-24 采纳；fine_only 6 对仅敏感性）
  mask: 残基任务用文献区段掩码；无区段对仅入全局层
  confound_gate:   # G1 限定 1（2026-09-24）：未通过前不得把状态判别表现归因为模型识别双态机制
    rule: 除 porter_87 外 9 对构建体不等性须进入混杂检查；至少设长度、观测覆盖或链边界三类简单对照
    until_passed: 结论仅可表述为"与构建体差异共变的可读性"，不得归因双态机制识别
  primary_contrasts: M vs F-only vs M+F vs permutation（evaluation_protocol.primary_contrasts）
  metrics: 配对准确率/一致性变化 + 残基级 AUPRC 与区段 IoU（T-FS-REGION）；无校准要求（病例内分析）
  conclusion_scope: 仅阳性内部机制；禁止外推发生率或家族泛化

L2_pu_ranking:
  question: 已证折叠转换蛋白在固定未标注序列背景中的排序与富集（PU 语义）
  population: 阳性=strict 10；背景=宇宙 A 484,179（Swiss-Prot 2026_03，去重/排除规则见背景配置）
  unit: 蛋白（阳性蛋白与背景蛋白同级排序）
  input: 纯序列（M 通道）；条件特征 F 不参与本层（无背景条件元数据）
  observed_label: pu_observed_label——阳性=1（已证实），背景=0（仅"当前未被确认为阳性"，允许含隐阳性）
  mask: 全体参与排序；无残基掩码
  metrics: recall_at_k、enrichment_at_k、positive_rank_percentile（主）；family_stratified_enrichment、leave_family_out_enrichment（敏感性）——名称与 evaluation_protocol.three_layer_metrics.L2 逐字一致
  k_rules_frozen:
    k_values: [10, 100, 1000, 10000]
    base_rate_note: 10 阳性/484,179 背景，基准率约 2.06e-5；enrichment@k 以此为分母
    family_stratification: 蛋白主家族=字典序最小 Pfam ID（SIFTS 2026-09-20），无 Pfam 用 CATH、再无用 SCOP2-FA、均无入 unassigned 桶
    leave_family_out: 逐正例 leave-one-out——从背景剔除与该正例共享任一家族系统（三系统并集）的蛋白后重算 recall/enrichment/rank
  statistics_note: 统计参数使用 evaluation_protocol 冻结值（B/CI/种子/多重比较——当前待确认，未经确认不得引用具体数值）
  conclusion_scope: 排序/富集陈述；禁止解释为总体发生率；背景含隐阳性的方向性偏差写入报告固定段
  background_version_lock: 背景宇宙固定版本后不得更换（与 evaluation_protocol 4b/split_protocol 3c 同款约束；更换=新任务+全链重建）

L3_matched_case_control:
  question: 阳性与操作性定义的推定阴性对照的判别（病例-对照设计）
  population: 病例=strict 10（其中 B9W5G6/Q58AD3/Q8E473 暂不进入主结果——G1 限定 3，结构相似探索后过复核可回补）；对照=PN 池（当前 138 唯一候选：PN-A 59/PN-B 38/PN-C 26；EXITED 15 不入对照；**PN-C 不用于凑足主结果**）
  unit: 病例-对照匹配集（matched_set_id；由 P2.01 生成，绑定不跨 split）
  input: 序列 + 预登记样本属性（匹配变量仅用家族/长度/结构数/覆盖/方法/分辨率/独立研究数/组装——禁止模型输出）
  observed_label: 病例=1；对照=putative（PN 证据覆盖层，非生物学阴性证明）
  manual_fulltext_gate:   # G1 限定 2（2026-09-24）：适用所有实际入选对照，不限关键词标记候选
    rule: 确证性主分析仅使用完成逐例人工全文复核的实际入选 PN-A 对照；最终病例数以复核+匹配完成后数字为准
    pending_cases: P02829/P0DP29（P1.16 标记）及其余入选复核未做者
  mask: 无
  metrics: AUROC、AUPRC、balanced_accuracy、MCC、per_class_precision_recall（主，名称与 evaluation_protocol.three_layer_metrics.L3 逐字一致）；校准=disabled_unless_population_prevalence_correction_is_registered；PN-A 为主对照，PN-B/PN-C 仅敏感性并分列
  conclusion_scope: 判别与匹配平衡陈述；类别比例由设计产生，禁止患病率解释；PN 层敏感性与全文复核状态必须随附

entry_conditions:
  strict: tier=strict_state_candidate（10 对；序列身份与双态证据分列，见 L1.population）
  extension: extension_construct_difference/extension_condition_or_assembly 层进入敏感性分析；
    porter_8 表内分层随 P1.24 重建落实（G1 限定 2 采纳 extension_condition_or_assembly）
  unlabeled: 背景 A/B 按 P1.10 配置；pending_evidence 53 对保留为未标注（PU 语义）
  PN-A: completed 检索+无退出类命中+独立研究>=2+mapped 覆盖>=0.70；入选匹配集另须逐例人工全文复核（manual_fulltext_gate）
  PN-B: completed+无退出类命中+PDB>=2
  PN-C: 兜底层（弱覆盖/截断/检索未完成）；不得用于凑足 L3 主结果（G1 限定 3）
  exited: 命中 fold_switching/domain_swapping 者退出，进复核队列，永不入对照

