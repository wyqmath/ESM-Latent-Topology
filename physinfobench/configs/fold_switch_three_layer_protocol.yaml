# 折叠转换三层任务合同（P1.12 冻结稿；G1 已于 2026-09-24 有条件确认——选项一+六项限定，
# 见 meta.g1_confirmation 与 logs/decisions.md 同日条目；限定未列处仍按本合同原文执行）
# 治理：本文件与 claims/evaluation_protocol/split_protocol 的 ID 与指标名一致（由
# scripts/validate_three_layer_protocol.py 以 jsonschema+交叉核对强制）。
# 语义铁律：unlabeled 不是阴性；PU 观测标签仅"当前未被确认为阳性"；L3 类别比例由设计产生，
# 校准禁用；matched_set_id 不可跨 split。
# G1 措辞禁令（2026-09-24 用户限定 3）："当前未找到同家族候选"不得写成生物学上不存在同家族
# 蛋白；未获证据支持的"未见家族""独立确认"或 L3 阴性结论一律保留为未成立。

