downgrade_rules:
  - id: D1_zero_family_positives
    condition: B9W5G6/Q58AD3/Q8E473 当前注记下无同家族候选（家族注记缺口随附——B9W5G6=14/17
      PDB 有注记口径，P1.21）
    decision: G1 2026-09-24（限定 3）——暂不进入 L3 主结果；P2.01 可探索 Foldseek 结构相似
      候选，成功且过复核（含 manual_fulltext_gate）可回补；报告须说明家族注记缺口；
      "当前未找到同家族候选"≠生物学上不存在同家族蛋白
  - id: D2_thin_pools
    condition: P00573 候选 3 个、P19726 候选 2 个
    rule: 仅 1:1 匹配；1:3/1:5 对这两个阳性声明不可行，不强行放宽
  - id: D3_region_dual_criteria
    condition: usable 3/10、fine 9/10 双口径
    decision: G1 2026-09-24（限定 2）——主口径=fine∧usable 3 对 6 行（案例级区段定位）；
      fine_only 6 对仅敏感性
  - id: D4_pna_fulltext_gate
    condition: PN-A 59 的逐例人工全文复核未完成
    decision: G1 2026-09-24（限定 2，较原建议强化）——L3 确证性主分析仅使用完成逐例人工全文
      复核的实际入选 PN-A 对照（适用所有入选对照，不限关键词标记候选）；最终病例数以复核+
      匹配完成后数字为准
  - id: D5_truncated_search_backfill
    condition: 4 个复用截断候选（含 P06787，797 命中仅覆盖 top25）
    rule: P2.01 匹配前补抓全量或按检索覆盖=top25 降权；未处理前不作为 PN-A 使用（当前均 EXITED，不实际影响）
  - id: D6_fs_split_infeasible
    condition: FS 独立组数不足以支撑 70:15:15 直拆（P1.09）
    decision: G1 2026-09-24（建议 5 承接限定 4）——FS 三任务不单独三集合划分；归入全局划分的
      分组约束（pair/family/matched_set 不可拆），跨家族泛化以 leave-family-out 敏感性陈述
      （评估口径，不作训练未见家族证据）；历史接触按 historical_contact 节随行

