  travelling_annotations: [TrEMBL 锚定例外 Q8E473/Q9YA14（REST 锚）, 家族注记缺口（B9W5G6 3+Q12931 2 PDB 无行；P0DP29 3evv 漏计）, PubMed 链接缺失 102 例]
  scope: 以 P1.21 已审计的连接和用途为准；例外随样本进入下游报告
