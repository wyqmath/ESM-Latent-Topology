      split_manifest(task_area=knot ∧ split=confirmation) ∩ knots.tsv
      (presence_mask=1) ∩ knots_sequences.tsv（序列已解析）；
      标签=knots.tsv presence_target（与 knots_sequences 逐链一致性断言）。
    declared_usable:
      pos: 24
      neg: 126
    evaluable_locked:
      pos: 22
      neg: 126
      total: 148
    no_sequence_dropped: ["knot:1giy_M", "knot:2hfx_A"]
    no_sequence_note: >-
      两条 presence_target=1 链无解析序列（knot:1giy_M、knot:2hfx_A；
      knots_sequences_unavailable.tsv：pdb_entry_not_in_wwpdb_archive；
      同表 knot:1s1h_I 不在确认 split，与本口径无关）。
      覆盖缺口如实披露：可评价集 22/126 vs 声明集 24/126；指标在可评价集上计算，
      报告须并排披露两口径；构建器强断言缺失集合恰为该两条。
    dev_fit_universe: 750
    dev_fit_note: >-
      dev ∩ 同规则 → 声明 138+623，有序列 750（P4.02 同口径断言）。
  fs_strict:
    derivation: >-
      split_manifest(fold_switch ∧ confirmation) ∩ fold_switch_global
      (target=1 ∧ valid_mask=1)。
    n_strict_locked: 0
    n_strict_note: >-
      确认 6 对（porter_15/18/25/35/63/89）全部 valid_mask=0
      （4×pending_evidence + 1×fragment_only + 1×pending_evidence）→
      H-FSL2-RANK 走 P4.09 预注册分支：verdict=insufficient_evidence（不构成失败），
      主指标 NA。
  disorder:
    derivation: >-
      split_manifest(disorder ∧ confirmation) 全 432 行；可评价=分母域残基>0
      （disorder_masks state∈{0,1} ∧ mask=1；截断 1022 外裁剪；
      全域空=EMPTY_EVALUABLE_SET 出分母并登记）；
      运行时强断言：432 = 抽取 + 空域 + 全域超界。

# -----------------------------------------------------------------------------
# 假设 → 冻结运行协议（判据逐字承自 confirmatory_hypotheses.yaml，不改动）
# -----------------------------------------------------------------------------
hypotheses:
  - id: H-KNOT-PRESENCE
    claim: C-GE1 + T-KNOT-PRESENCE
    statement: >-
      打结存在性在确认集可读（development AUROC 0.929）。
    direction: AUROC > 0.5（阳性高于阴性）
    metric: >-
      AUROC（确认集可评价 148；同一固定读出，无再拟合超参）。
    pass: AUROC ≥ 0.80
    strong_pass: AUROC ≥ 0.90
    fail_rule: >-
      点估计 <0.65 且 95%CI 上界 <0.80；点估计 <0.80 但上界 ≥0.80=证据不足（中间带）。
    boundary: 条件无关全局属性；不外推打结类型。
    run_protocol:
      features: >-
        hidden 33 全残基均值（data/interim/p402/emb_knots_resid 同协议；
        确认集以同协议补抽 data/interim/p502/emb_knots_conf，resid-layers 23,29,33）。
      reader: >-
        LogisticRegression(C=1, class_weight=balanced, solver=liblinear,
        max_iter=1000, random_state=2026)；仅 development（750）一次拟合。
      controls:
        - control_id: C0_permutation
          spec: >-
            确认标签置换 ×100（seed 2026..2125）→ AUROC 零分布
            （mean/sd/min/max；期望 ≈0.5）。
        - control_id: B_len_length_only
          spec: >-
            log1p(链长) 单特征同配置 dev 拟合 → 确认 AUROC
            （轻量基线：长度是否足以解释）。
      coverage: >-
        缺失即 die（禁止静默子集）；no_sequence_dropped 双口径披露。

  - id: H-FSL2-RANK
    claim: C-GE1（跨家族泛化）+ BN5
    statement: >-
      冻结线性打分器（L5=hidden 29、C=0.1，dev 拟合）将确认集 strict 阳性在
      全背景排序中置于前列。
    direction: 阳性排名显著前于随机
    metric: positive_rank_percentile（主）+ recall@1000/@100（辅）
    pass: recall@1000 ≥ 0.5（比例语义）
    strong_pass: recall@1000 = 1.0 且 percentile ≤ 0.001
    fail_rule: recall@1000 < 0.2 或 percentile > 0.05
    n_strict_rule: >-
      n_strict=0 → verdict=insufficient_evidence（不构成失败）；主指标 NA。
    boundary: 直推排序语义；不构成状态判别或因果主张。
    run_protocol:
      n_strict_recompute: >-
        运行时按 fs_strict.derivation 复算并断言 ==0；≠0 → die
        （偏离走 P5.03，lock 不含 >0 分支）。
      controls_and_baselines: >-
        B0–B3 dev 同宇宙基线已存（results/baselines_v2，哈希钉版）；
        n_strict=0 时不适用（如实报告 NA）。
      descriptive_side_table:
        what: >-
          确认 6 对端点均值向量（hidden 29）以冻结 stage-B 协议打分与排序
          （重拟合：dev 47,595 代表帧 + 10 dev strict，liblinear seed 2026）。
        integrity: >-
          重拟合分数与钉版 stageB.scores.tsv.gz 全量逐代表一致性断言
          （max|Δ|≤1e-9）——packed 表示完整性以此内容级校验承担
          （不对约 0.7GB 大包做文件哈希，如实披露该选择）。
        semantics: >-
          无阈值、无 verdict、不进任何假设判定；仅供 P5.06 裁决上下文；
          排名 pool=存储分数 342,004 簇代表背景（stageB.scores.tsv.gz 实际行数，
          universe_bg_expected=342004）+ 10 dev strict + 当对 = 342,015
          （percentile=rank/pool_n）。

  - id: H-DISORDER-RES
    claim: C-GE1 + T-DISORDER-RES
    statement: >-
      残基级无序可读（development 池化 AUPRC 0.9996；逐蛋白 0.904 为 n=4 描述）。
    direction: AUPRC 高于残基正例率基线
    metric: >-
      确认集分母域残基池化 AUPRC（主）+ 逐蛋白 AUPRC（描述，双类蛋白列数披露）。
    pass: 池化 AUPRC ≥ 0.90
    strong_pass: 池化 AUPRC ≥ 0.97
    fail_rule: 池化 AUPRC < 0.75
    boundary: >-
      池化口径天花板效应在 dev 已示警——阈值按池化口径冻结，逐蛋白口径仅描述。
    run_protocol:
      features: >-
        hidden 33 逐残基（分母域；dev=data/interim/p303/emb_disorder_dev 2,279 蛋白
        断言；确认以同协议补抽 data/interim/p502/emb_disorder_conf）。
      reader: >-
        LogisticRegression(C=0.01, class_weight=balanced, solver=liblinear,
        max_iter=1000, random_state=2026)；仅 development 全分母域残基一次拟合
        （无 CV、无早停、无阈值选择；C=0.01 为 dev 已选冻结值）。
      uncertainty: >-
        池化 AUPRC 95% CI=蛋白单位 bootstrap（B=2000，残基池化随蛋白重组）。
      controls:
        - control_id: C0_permutation
          spec: >-
            蛋白内置换 ×100（seed 2026..2125）→ 池化 AUPRC 零分布。
        - control_id: B0_base_rate
          spec: 确认残基正例率（随机分类器 AUPRC=prevalence）如实并列。
      coverage: >-
        432=抽取+空域+全域超界 强断言；双类蛋白计数披露。

