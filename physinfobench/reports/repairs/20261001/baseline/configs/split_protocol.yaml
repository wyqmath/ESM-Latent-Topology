# =============================================================================
# configs/split_protocol.yaml — P0.06 数据划分与曝光规则（协议纪律冻结；划分参数延后冻结）
# 规则：角色、权限、纪律即刻生效。划分参数（比例/阈值/种子/备用池方案）的冻结走 3b 节硬前置
#       Gate：P1.09 审计+可行性建议提交并经用户确认后，才可在 P2.01/P2.02 冻结与生成划分；
#       未确认前不得生成任何划分，不得拆组或放宽门槛（用户 2026-09-21 09:35 决策）。
# =============================================================================

meta:
  task: P0.06
  created_at: "2026-09-21 09:18"
  timezone: Asia/Shanghai
  status: thresholds_frozen_2026-09-24   # 演进：protocol_frozen(09-21)→thresholds_deferred(09-21 09:35)→
    # thresholds_frozen(2026-09-24，用户委托授权："后面的你替我抉择"，见 logs/decisions.md 同日 02:34 条目；
    # 步骤一可行性报告=reports/fs_three_layer/p201_step1_grouping_feasibility.md 已按限定 6 交材料)。
  inputs: [configs/sample_schema.yaml, configs/claims.yaml, configs/evaluation_protocol.yaml]

# -----------------------------------------------------------------------------
# 1. 数据集合角色与权限
# -----------------------------------------------------------------------------
sets:
  discovery:
    role: 瓶颈探索、候选信息干预初筛、层/读取器/聚合选择、超参数与阈值选择
    internal_structure: 发现集内部按组隔离的训练/验证折（早停、选层、调参专用）；确认集不承担该角色
    permission: 执行代理可读写使用；所有选择行为记入曝光日志
  confirmation:
    role: 验证预设对比的效应方向、基线增益、负对照合理性、种子稳定性与覆盖率
    permission: 只用于评价；不得拟合归一化、不得选最佳轮次、不得触发任何选择
    first_read: 登记授权读取者与首次读取时间（P5.01/P5.02）
  backup_confirmation_pool:
    role: 确认失败降级后的替换来源；与主确认集同约束生成
    permission: 未触发替换前视同未确认集隔离
    sourcing_open_question:   # 用户 2026-09-21 09:35 指出的缺口：比例分满 100% 后备用池从何而来
      - 候选 A：发现集内部预留（实际比例变为如 55:15:15+15 备用，总预算不变）
      - 候选 B：依赖 P1 之后新增数据（不可靠，仅作说明项）
      - 候选 C：分层/多折确认设计（轮流留出确认折）
      - 由 P1.09 后的可行性建议逐任务评估并经用户确认，本协议不预设选项
  final_holdout:
    role: 最终泛化的黑盒测试；零参数回传
    permission: 标签仅限经用户明确授权的最终运行读取；每次访问记录时间/用途/范围
    unlock_conditions:
      - G4 已确认；确认回路（含可能的降级重确认）已闭合
      - P5.04 final_lock 冻结并经独立审核；配置/代码/权重校验值留痕
      - 保留集曝光日志核验为零（或仅有已申报的无关访问）
      - 用户明确授权解锁（不默认解锁；等待不构成批准）

# -----------------------------------------------------------------------------
# 2. 不可跨集合的绑定关系（与 sample_schema.pairs、P2.01 group_map 衔接）
# -----------------------------------------------------------------------------
binding_rules:
  - 同蛋白多状态样本（同 sequence_hash 或同构建体）必须同集合。
  - 状态/条件配对组（pair_group_id）必须同集合。
  - 序列同源组·已冻结 2026-09-24：mmseqs2 easy-cluster（18-8cc5c）min-seq-id 0.30、-c 0.70、
    cov-mode 0（双端覆盖）→ 同簇绑定；工具与口径见 p201_step1_grouping_feasibility.md §1。
  - 结构近邻组·已冻结 2026-09-24：US-align（tools/USalign-bin 20260908）单链 TM>=0.60 且
    **min 对称化**（两条归一化 TM 均需 >=0.6）→ 绑定；理由=单调侧 max 口径产生 35 对巨组并把
    6/10 strict 锁入同组（可行性报告 §4）；残余单侧相似由 P2.03 泄露审计复核并在划分报告披露。
  - 缺失结构样本·已冻结 2026-09-24：不默认视为不相似——按序列同源规则处理并在 group_map 标注
    缺失；结构近邻计算范围=项目内已算结构（P2.01 步骤一覆盖折叠转换 192 端点+16 主选候选）；
    knots 等其余宇宙的结构近邻边在 P2.03 审计中补算/复核（Foldseek，集群），属登记残留。
  - 上述关系全部进入 P2.01 的边表（每条边带原因与数值）；禁止为平衡类别切开组。

# -----------------------------------------------------------------------------
# 3. 分配比例与可行性
# -----------------------------------------------------------------------------
allocation:
  unit: 分组约束合并后的组（group），不以样本为单位
  target_proportions: 已冻结 2026-09-24——70:15:15（development:confirmation:final_holdout），
    按组分配；FS 任务维持 D6 不单独三集合（并入全局分组约束）。冻结依据=用户委托授权
    （logs/decisions.md 2026-09-24 02:34）+P1.17/步骤一可行性（组数 89、最大组小、无巨组障碍）
  method: 按组分层（任务标签构成）分配；只用协议允许的标签计数平衡，绝不用模型性能决定划分
  min_evaluable:
    rule: P1.09 数据审计后逐任务确定；不满足的记不可行并讨论（降级或补数据），不静默降低
  infeasibility: 任何任务无法满足比例+最低可评价量时，保留旧版本划分、记录原因、提交讨论后再重新生成
  seed: 已冻结 2026-09-24——2026（划分分配专用；统计 bootstrap 种子族仍按 evaluation_protocol
    待确认参数处理，两者互不覆盖）
  guardrail: 严禁为凑出三集合而拆开强制绑定组、放宽同源/结构门槛、或把不可行任务伪装成可行；
    任何放宽只能经用户讨论确认并留痕（用户 2026-09-21 09:35 明确要求）

# -----------------------------------------------------------------------------
# 3b. 划分参数冻结的硬前置 Gate（用户 2026-09-21 09:35 决策）
# -----------------------------------------------------------------------------
feasibility_gate:
  trigger: P1.09 完成之后、P2.01 分组实现之前
  required_submission:
    - 每任务有效样本数、独立组数、类别构成（原始量→证据合格→可映射→可评价流失表）
    - 合并全部绑定约束后的组数量与规模分布（含巨型连通组分析）
    - 每任务历史曝光审计（旧 v5 development/test 归属、已用于方法选择的数据清单）
    - 家族层隔离可行性评估（能否支撑"未见家族"测试，或须降级为"未见蛋白"并如实命名）
    - 备用确认池来源方案（候选 A/B/C 的取舍建议）
    - 划分比例、最低可评价量、种子的冻结建议与不可行任务清单
  decision: 以上材料经用户确认后才允许冻结划分参数并进入 P2.01/P2.02；无确认不划分。
    [2026-09-24 履行记录] required_submission 各项已齐（P1.09 审计/P1.17 预演/P1.19 曝光四口径/
    P1.11 家族与备用池评估/步骤一报告）；用户以委托授权方式放行（见 meta.status 与 decisions.md
    2026-09-24 02:34 条目）；不可行项（FS 三集合直拆、备用池缺位、P19726 无 PN-A）按 D 规则降级
    并如实披露，未拆组、未放宽门槛。
  rationale: 折叠转换严格候选有限、约束合并后组数可能进一步减少，预设比例可能不可行；
    旧数据重新分配不自动成为未见数据；序列/结构隔离不自动等于未见家族（用户指出）

# -----------------------------------------------------------------------------
# 3c. 三层任务划分规则（2026-09-22 治理变更新增；冻结归 P1.12+G1，实现归 P2.01/P2.02）
# -----------------------------------------------------------------------------
three_layer_split_rules:
  registered: "2026-09-22 治理变更"
  layer2_pu_rank:
    - strict positive 及其同源/结构近邻必须同一集合
    - unlabeled 背景按组分配；背景宇宙固定版本后不得更换
    - 历史用于方法选择的蛋白不得通过重新划分恢复"未见"身份（legacy_policy 同样适用）
    - leave-family-out 分析时整个家族进入同一集合
  layer3_matched_case_control:
    - 一个 strict positive 与其匹配对照共享 matched_set_id；整个 matched set 同一集合、不可跨集合
    - 每个集合分别报告病例数、对照数、独立家族数与 PN 等级分布
    - 某集合无法同时保持足够病例与独立对照时任务降级并提交讨论；不通过拆分同源组/匹配组凑数量
  historical_exposure: 重新划分不自动使已用数据成为未见数据；旧 v5 分配与曝光记录继续作为划分输入（见 legacy_policy）
  unseen_family: 未见家族结论需独立家族层隔离审计支撑（见 3b feasibility_gate 与 legacy_policy）；序列/结构隔离本身不构成未见家族证据

# -----------------------------------------------------------------------------
# 4. 曝光日志（logs/exposure_log.tsv）
# -----------------------------------------------------------------------------
exposure_log:
  columns: [timestamp, operator, action, dataset_or_set_version, scope_sample_ids,
            content_read, purpose, influenced_method_selection, downgrade_triggered, notes]
  rules:
    - 确认/保留集每次读取（含部分读取）必须逐行登记；无读取时日志保持仅表头。
    - influenced_method_selection=Yes 的读取触发降级：该确认批次并入开发曝光并划出新确认集。
    - 每次划分重新生成都登记旧版本号、新版本号与重生成原因；旧版本不删除。

# -----------------------------------------------------------------------------
# 5. 确认失败回路
# -----------------------------------------------------------------------------
confirmation_loop:
  trigger: 确认结果不支持假设、对照失效、覆盖不足或方法缺陷
  steps:
    1. logs/decisions.md 记录事实、证据、影响、选项（用户讨论）。
    2. 若需修改方法：相关 P3/P4 任务显式重开 → 修改 → 独立审核 → 提交。
    3. 已读取的确认批次登记降级（曝光日志 downgrade_triggered=Yes）。
    4. 从未曝光且满足相同绑定约束的数据生成新确认集（不从最终保留集挪样本）。
    5. 重新 P5.01 注册 → P5.02 确认；迭代编号与历史失败保留，不删除。
  stop_condition: 无足够未见数据形成新确认集时，停在 Gate 待决策；不以换种子重分已曝光样本冒充新确认。

# -----------------------------------------------------------------------------
# 6. 与旧项目划分的关系（迁移纪律，来源：logs/handoff_20260921_0756.md §3.6）
# -----------------------------------------------------------------------------
legacy_policy:
  - 旧 v5 只有 development/test；不得改名充当新三集合。
  - 保留旧分配与曝光记录；新划分设计必须以历史曝光为输入，识别"已用于方法选择的数据"。
  - 旧家族审计记录部分分类层级跨集合共享——新方案中家族层只能作信息性分析，不得宣称未见家族，
    除非新保留集经审计满足家族级隔离。

# -----------------------------------------------------------------------------
# 7. G2 有条件确认（用户 2026-09-24 15:47；完整原文要点=logs/decisions.md 同刻条目）
# -----------------------------------------------------------------------------
g2_confirmation_2026_09_24:
  status: confirmed_conditional
  ruling_min_rule:            # 裁决一：结构近邻操作口径与主张边界
    criterion: US-align 单链 TM>=0.6 + min 对称化（维持冻结，本轮分组与主分析操作口径）
    claim_boundary: 只能声称 min 规则下通过结构近邻绑定检查；不得声称所有单侧结构相似关系均已跨集合隔离
    max_rule_residual: 31 条跨集合边（dev-conf 8 / dev-hold 23；涉 22 个 FS 对，其中 strict 3 个 porter_9/61/62）
    residual_registry: reports/g2_rev_maxrule_edges.tsv + reports/g2_rev_recompute.md §5
    sensitivity_plan: 模型结果出现时按 max 口径合并涉边组重算（或剔除涉边样本）复核主结论；
      结论依赖这些边或样本量不足即按协议降级，不改口径掩盖风险
    label_discipline: 不读取 confirmation/final_holdout 标签选择规则
  ruling_knots_recompute:     # 裁决二：打结结构近邻补算
    allowed_now: 不依赖"打结样本已通过完整结构隔离验证"结论的工作（输入准备/表示提取/分析代码/development 探索）
    forbidden_until_recomputed: 补算及必要 US-align 确认完成前，不得把打结 confirmation/final_holdout
      结果表述为已完成结构隔离的独立验证
    on_cross_set_neighbor: 保留旧划分与差异记录，按协议修订划分并重跑受影响分析
  applicability:              # 四项适用范围（G2-REV 第 4 项）
    - 10 对 strict 折叠转换阳性均在 development；FS 主分析=development 层诊断
    - 17 个 L3 对照逐例全文复核通过前不进入确证主分析（适用于全部入选对照）；最终病例数以复核+匹配完成后为准
    - P2.06 同一 development 宇宙拟合并报告的逻辑回归仅作描述性诊断
    - 统计参数（bootstrap/CI/多重比较/种子）须在 P3.02 前冻结
  release: G2-REV（核对修订）独立审核通过并提交后，Phase 3 中不依赖未完成审计结论的任务即可推进，
    不必为 min 规则或打结非依赖性工作再次等待用户回复
  stop_conditions:
    - 补算发现需重划分
    - 敏感性检查推翻主结论
    - 下一任务必须依赖尚未完成的确证证据
  process_deviations: reports/fs_three_layer/process_deviation_log.md Phase 2 节（P2.03/P2.04
    共享提交 835203f；P2.05/P2.06 并行窗口 03:56–04:05）

